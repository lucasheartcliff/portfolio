services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # keep in sync with .tool-versions (or export NODE_VERSION=$(scripts/node-version.sh))
        NODE_VERSION: ${NODE_VERSION:-18.20.8}
    restart: unless-stopped
    env_file:
      - local.env.local
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portfolio
