name: Lighthouse CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: asdf-vm/actions/install@v3
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lighthouse
        env:
          NEXT_PUBLIC_URL: http://localhost:3000
